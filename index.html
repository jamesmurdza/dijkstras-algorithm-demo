<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dijkstra's Algorithm — Interactive Subway-Map Visualization</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Dijkstra's Algorithm</h1>
    </header>

    <!-- Main row: the graph canvas plus an optional sidebar. The sidebar
         (step/table) is docked in normal flex flow, not an overlay - the
         canvas shrinks to make room for it - and is only in the DOM's
         visible flow when a toolbar toggle opens it, so the canvas stays
         the whole UI by default. -->
    <main class="main-area">
      <div class="canvas-area" aria-label="Graph visualization">
        <div id="graph-container" class="graph-container">
          <!-- SVG graph is built and updated entirely by app.js -->
        </div>
      </div>

      <!-- Sidebar: shows EITHER the current-step panel OR the status
           table, toggled by the two buttons on the right of the toolbar.
           Hidden by default. -->
      <aside id="drawer" class="drawer" aria-label="Details" hidden>
        <div id="drawer-step" class="drawer-panel">
          <div class="step-box__top">
            <span id="frame-badge" class="frame-badge">Init</span>
            <span id="step-counter" class="step-counter">Step 1 / 1</span>
          </div>
          <p id="step-description" class="step-description">Loading…</p>
        </div>

        <div id="drawer-table" class="drawer-panel">
          <div class="table-wrap">
            <table class="stats-table" id="stats-table">
              <caption>Tentative distances &amp; best-known routes from S</caption>
              <thead>
                <tr>
                  <th scope="col">Node</th>
                  <th scope="col">Status</th>
                  <th scope="col">Distance</th>
                  <th scope="col">Best-known route</th>
                </tr>
              </thead>
              <tbody id="stats-tbody"><!-- rows injected by app.js --></tbody>
            </table>
          </div>
        </div>
      </aside>
    </main>

    <!-- Toolbar: the only other piece of UI besides the canvas. Reset /
         Back / a long slider / Next / Play on the left, the two drawer
         toggles on the right. -->
    <footer class="toolbar" role="group" aria-label="Step controls">
      <button id="btn-reset" class="btn btn--icon" type="button" title="Reset to the beginning" aria-label="Reset to the beginning">⟲</button>
      <button id="btn-back" class="btn btn--icon" type="button" title="Previous step" aria-label="Previous step">←</button>
      <input id="step-slider" class="slider" type="range" min="0" max="0" step="1" value="0"
             aria-label="Algorithm step" />
      <button id="btn-next" class="btn btn--icon" type="button" title="Next step" aria-label="Next step">→</button>
      <button id="btn-play" class="btn btn--icon" type="button" title="Auto-play through the steps" aria-label="Auto-play through the steps">▶</button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button id="btn-toggle-step" class="btn btn--icon btn--toggle" type="button" aria-pressed="false" title="Show the current-step panel" aria-label="Show the current-step panel">ℹ</button>
      <button id="btn-toggle-table" class="btn btn--icon btn--toggle" type="button" aria-pressed="false" title="Show the distances table" aria-label="Show the distances table">▦</button>
    </footer>
  </div>

  <script src="dijkstra.js"></script>
  <script src="routing.js"></script>
  <script src="app.js"></script>
</body>
</html>
